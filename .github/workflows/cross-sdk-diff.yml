name: Cross-SDK Differential Tests

on:
  push:
    paths:
      - 'test/vectors/**'
  pull_request:
    paths:
      - 'test/vectors/**'
  workflow_dispatch:

jobs:
  differential-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "Full matrix"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run cross-SDK differential tests
        run: |
          chmod +x test/vectors/cross-sdk-diff.sh
          set +e
          test/vectors/cross-sdk-diff.sh 2>&1 | tee /tmp/diff-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "---"
          echo "Divergences found: $EXIT_CODE"

      - name: Generate results matrix
        run: |
          chmod +x test/vectors/generate-matrix.sh
          test/vectors/generate-matrix.sh > test/vectors/RESULTS.md

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: cross-sdk-results
          path: |
            test/vectors/RESULTS.md

      - name: Post JSON results
        run: |
          set +e
          test/vectors/cross-sdk-diff.sh --json > /tmp/results.json
          set -e
          python3 -c "
          import json
          with open('/tmp/results.json') as f:
              d = json.load(f)
          divs = sum(1 for x in d if not x['agree'])
          print(f'Tests: {len(d)}, Divergences: {divs}')
          "

name: Publish Docker Image

# Manual only. Previously ran on `push: tags: v*`, and the `paths` filter did
# NOT suppress it — GitHub does not evaluate path filters for tag pushes, so
# every tag rebuilt the image and moved the public `latest` and `0.8` pointers
# regardless of whether anything under test/vectors had changed. Verified
# against the v0.8.0 and v0.8.1 tag pushes, both of which ran.
#
# This file already carried workflow_dispatch before that change, so dispatching
# against the v0.8.2 tag does work here, unlike npm-publish.yml:
#
#   gh workflow run "Publish Docker Image" --ref v0.8.2
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mcp-diff

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./test/vectors
          file: ./test/vectors/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

# Example security-insights.yml snippet demonstrating SIEP-171 integration
# This shows how governance-declaration works with a machine-readable target.
# Values below are illustrative placeholders; substitute your own repository
# URL and set `used` to reflect the actual state of your project.

repository:
  url: https://github.com/example/repo
  status: active
  agent-assisted-production:
    used: false
    governance-declaration: https://github.com/example/repo/blob/main/.well-known/agent-governance.json

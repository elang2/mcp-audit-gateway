[package]
name = "mcp-signer"
version = "0.1.0"
edition = "2021"

[dependencies]
ed25519-dalek = "2"
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# regex + once_cell power the daemon's raw-line id extractor. serde_json
# refuses to parse envelopes whose records contain lone UTF-16 surrogates
# (e.g. "\uD83D" with no low surrogate); the regex runs against the wire
# bytes before parsing so we can still emit a response carrying the
# request id when the envelope itself is unparseable.
regex = "1"
once_cell = "1"
# Two independent Rust RFC 8785 (JCS) implementations, wired as separate
# binaries so we can catch places where they disagree with each other or
# with the RFC 8785 reference test vectors from cyberphone.
serde_jcs = "0.2"
serde_json_canonicalizer = "0.3"

[[bin]]
name = "sign"
path = "src/sign.rs"

[[bin]]
name = "verify"
path = "src/verify.rs"

[[bin]]
name = "sign_jcs_serde_jcs"
path = "src/sign_jcs_serde_jcs.rs"

[[bin]]
name = "sign_jcs_canonicalizer"
path = "src/sign_jcs_canonicalizer.rs"

[profile.release]
opt-level = 3
